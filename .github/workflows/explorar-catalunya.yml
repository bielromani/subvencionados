# Diagnóstico manual: qué publica la Generalitat en datos abiertos sobre contratos (incluidos los menores) y la
# agenda cultural, y qué ofrecen las webs de festivales y circuitos privados. Solo lee y escribe en el registro.
name: Explorar Cataluña y festivales

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash {0}
    env:
      D: https://analisi.transparenciacatalunya.cat
    steps:
      - name: Columnas completas
        run: |
          for id in ybgg-dgi6 hb6v-jcbf qjue-2pk9 rhpv-yr4f 2n2k-gg9s; do
            echo "=== $id"; curl -sS -m 60 "$D/api/views/$id.json" | jq -r '.name, ([.columns[].fieldName] | join(", "))'
          done

      - name: Montblanc en contratos (PSCP y Registre)
        run: |
          q() { curl -sS -m 120 -G "$D/resource/$1.json" --data-urlencode "\$where=$2" --data-urlencode "\$limit=${3:-15}" ${4:+--data-urlencode "\$select=$4"} | head -c 6000; echo; }
          echo "=== ybgg Montblanc (órganos)"; q ybgg-dgi6 "upper(nom_organ) like '%MONTBLANC%'" 50 "nom_organ,count(*)&\$group=nom_organ"
          echo "=== ybgg Montblanc (muestra)"; q ybgg-dgi6 "upper(nom_organ) like '%MONTBLANC%'" 8
          echo "=== hb6v Montblanc (órganos)"; curl -sS -m 120 -G "$D/resource/hb6v-jcbf.json" --data-urlencode "\$select=organisme_contractant,situaci_contractual,count(*)" --data-urlencode "\$where=upper(organisme_contractant) like '%MONTBLANC%'" --data-urlencode "\$group=organisme_contractant,situaci_contractual" | head -c 4000; echo
          echo "=== hb6v Montblanc (muestra)"; q hb6v-jcbf "upper(organisme_contractant) like '%MONTBLANC%'" 10

      - name: Música en el Registre (CPV 9231 / 9232) por tipo y año
        run: |
          curl -sS -m 180 -G "$D/resource/hb6v-jcbf.json" --data-urlencode "\$select=exercici,situaci_contractual,count(*)" \
            --data-urlencode "\$where=starts_with(codi_cpv,'9231') OR starts_with(codi_cpv,'9232')" --data-urlencode "\$group=exercici,situaci_contractual" --data-urlencode "\$order=exercici" | head -c 4000; echo
          echo "=== muestra música menor ayuntamientos"
          curl -sS -m 180 -G "$D/resource/hb6v-jcbf.json" --data-urlencode "\$where=starts_with(codi_cpv,'92312') AND situaci_contractual='menor' AND upper(organisme_contractant) like 'AJUNTAMENT%'" --data-urlencode "\$limit=6" --data-urlencode "\$order=data_adjudicacio DESC" | head -c 6000; echo
          echo "=== palabras (concert) en registro"
          curl -sS -m 180 -G "$D/resource/hb6v-jcbf.json" --data-urlencode "\$select=count(*)" --data-urlencode "\$where=upper(descripcio_expedient) like '%CONCERT%'"; echo

      - name: Música en PSCP (ybgg) por fase
        run: |
          curl -sS -m 180 -G "$D/resource/ybgg-dgi6.json" --data-urlencode "\$select=fase_publicacio,count(*)" \
            --data-urlencode "\$where=upper(objecte_contracte) like '%CONCERT%' OR upper(denominacio) like '%CONCERT%'" --data-urlencode "\$group=fase_publicacio" | head -c 3000; echo
          curl -sS -m 180 -G "$D/resource/ybgg-dgi6.json" --data-urlencode "\$where=upper(denominacio) like '%CONCERT%' AND fase_publicacio like 'Formal%'" --data-urlencode "\$limit=3" | head -c 5000; echo

      - name: Agenda cultural Montblanc
        run: |
          curl -sS -m 60 -G "$D/resource/rhpv-yr4f.json" --data-urlencode "\$q=Montblanc" --data-urlencode "\$limit=3" | head -c 4000; echo
          curl -sS -m 60 -G "$D/resource/2n2k-gg9s.json" --data-urlencode "\$q=Montblanc" --data-urlencode "\$limit=2" | head -c 3000; echo

      - name: Webs de festivales y circuitos
        run: |
          for u in https://www.festclasica.com https://www.redescena.net https://www.rema-eemn.net https://www.efa-aef.eu https://www.festivalfinder.eu \
                   https://www.asaco.org https://www.adeteatros.es https://www.apmusicales.com https://www.lafede.cat https://www.acpcultura.cat; do
            echo "=== $u"
            curl -sS -m 40 -L -A "Mozilla/5.0 (compatible; subvencionados-exploracion)" -o /tmp/p.html -w "HTTP %{http_code} · %{size_download} bytes · %{url_effective}\n" "$u"
            grep -oi '<title>[^<]*' /tmp/p.html | head -1
            grep -oiE 'href="[^"]*(festival|socio|miembro|members|asociad|directori|ciclo|programador|sala|associats)[^"]*"' /tmp/p.html | sort -u | head -12
          done
