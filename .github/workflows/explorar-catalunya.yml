# Diagnóstico manual (solo lee y escribe en el registro): primeras filas de los CSV de contratos menores de Madrid
# de 2022 y 2025.
name: Explorar fuentes

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Madrid 2022 y 2025
        run: |
          for u in https://datos.madrid.es/dataset/300253-0-contratos-actividad-menores/resource/300253-23-contratos-actividad-menores-csv/download/300253-23-contratos-actividad-menores-csv.csv https://datos.madrid.es/dataset/300253-0-contratos-actividad-menores/resource/300253-27-contratos-actividad-menores-csv/download/300253-27-contratos-actividad-menores-csv.csv; do
            curl -sS -m 120 -L -A "Mozilla/5.0" "$u" -o /tmp/x.csv; file /tmp/x.csv; head -c 1500 /tmp/x.csv | od -c | head -3; head -4 /tmp/x.csv | cut -c1-900; grep -ic concierto /tmp/x.csv
          done
