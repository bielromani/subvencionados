# Diagnóstico manual (solo lee y escribe en el registro): formato de las fuentes de contratos de otras comunidades
# y de las webs de festivales.
name: Explorar fuentes

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash {0}
    env:
      UA: "Mozilla/5.0 (compatible; subvencionados-exploracion)"
    steps:
      - name: Euskadi (api.euskadi.eus/procurements)
        run: |
          curl -sS -m 60 "https://api.euskadi.eus/procurements/contracts?_page=1&_pageSize=2" | jq '.items[0]' | head -120
          curl -sS -m 60 "https://api.euskadi.eus/procurements/contracts?_page=1&_pageSize=2" | jq -c 'del(.items) ' | head -c 1500; echo
          curl -sS -m 60 -L -A "$UA" "https://opendata.euskadi.eus/webopd00-apicontract/es/?api=procurements" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -oiE "(/procurements/[a-z0-9/{}_-]+|_[a-zA-Z]+=)" | sort -u | head -60
          curl -sS -m 60 "https://api.euskadi.eus/procurements/openapi.json" | head -c 3000; echo
          curl -sS -m 60 "https://api.euskadi.eus/procurements/v3/api-docs" | jq -r '.paths | keys[]' 2>/dev/null | head -40

      - name: Navarra (Registro de contratos)
        run: |
          curl -sS -m 120 -L "https://datosabiertos.navarra.es/dataset/af6e7a24-2747-4c2e-bfb4-9e0de2a852c4/resource/ee871941-17ac-40fd-838b-7469e8a2e477/download/contrataciones_contratos_2025.csv" -o /tmp/n.csv; wc -lc /tmp/n.csv; file /tmp/n.csv; head -3 /tmp/n.csv | iconv -f latin1 -t utf8 2>/dev/null | cut -c1-1500
          iconv -f latin1 -t utf8 /tmp/n.csv 2>/dev/null | grep -iE "concierto|orquesta|musica|música|charanga|banda" | head -8 | cut -c1-600
          iconv -f latin1 -t utf8 /tmp/n.csv 2>/dev/null | grep -ciE "menor"

      - name: Andalucía (menores 2025)
        run: |
          u=$(curl -sS -m 60 -G "https://www.juntadeandalucia.es/datosabiertos/portal/api/3/action/package_show" --data-urlencode "id=contratacion-menor-plataforma-de-contratacion-andalucia-2025" | jq -r '.result.resources[] | select(.format|test("CSV";"i")) | .url' | head -1); echo "$u"
          curl -sS -m 120 -L "$u" -o /tmp/a.csv; wc -lc /tmp/a.csv; head -3 /tmp/a.csv | cut -c1-1200
          grep -iE "concierto|orquesta|actuaci" /tmp/a.csv | head -5 | cut -c1-500; grep -ciE "ayuntamiento" /tmp/a.csv

      - name: Festivales
        run: |
          get() { curl -sS -m 40 -L -A "$UA" -o /tmp/p.html -w "$1 → HTTP %{http_code} %{size_download}b\n" "$1"; }
          get https://www.festclasica.com/es/festivales.html; grep -oE 'https://www.festclasica.com/es/festivales/c/[0-9][^"]*' /tmp/p.html | sort -u > /tmp/fc.txt; wc -l < /tmp/fc.txt; head -60 /tmp/fc.txt
          get "$(head -1 /tmp/fc.txt)"; python3 -c "
          import re,html,sys
          s=open('/tmp/p.html',encoding='utf8',errors='ignore').read()
          s=re.sub(r'<(script|style)[^>]*>.*?</\1>','',s,flags=re.S)
          i=s.find('<main'); s=s[i if i>0 else 0:]
          t=html.unescape(re.sub(r'<[^>]+>','\n',s)); t=re.sub(r'\n\s*\n+','\n',t)
          print(t[:2500])
          print([h for h in re.findall(r'href=\"(https?://[^\"]+)\"',s) if 'festclasica' not in h][:15])
          print(re.findall(r'[\w.+-]+@[\w-]+\.[\w.]+',s)[:5])"
          get https://www.rema-eemn.net/members/; python3 -c "
          import re
          s=open('/tmp/p.html',encoding='utf8',errors='ignore').read()
          i=[m.start() for m in re.finditer('Spain',s)][:3]
          for k in i: print(re.sub(r'\s+',' ',s[max(0,k-700):k+100])); print('----')"
          get https://www.redescena.net/festival/3522/festival-de-la-guitarra-de-cordoba/; python3 -c "
          import re,html
          s=open('/tmp/p.html',encoding='utf8',errors='ignore').read()
          s=re.sub(r'<(script|style)[^>]*>.*?</\1>','',s,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s)); t=re.sub(r'\n\s*\n+','\n',t)
          k=t.find('Guitarra'); print(t[k:k+2000])"
          get "https://www.festivalfinder.eu/festivals?country%5B%5D=Spain"; grep -oE 'href="/festivals/[a-z0-9-]+"' /tmp/p.html | sort -u | head -5; grep -oE 'href="/festivals/[a-z0-9-]+"' /tmp/p.html | sort -u | wc -l
          grep -oE '(api|ajax|json)[^"'"'"' ]{0,80}' /tmp/p.html | sort -u | head -10
