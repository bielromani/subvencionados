# Diagnóstico manual (solo lee y escribe en el registro): tamaño de página y filtros de la API de contratos de Euskadi.
name: Explorar fuentes

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Euskadi
        run: |
          B=https://api.euskadi.eus/procurements/contracts
          for q in "_elements=1000" "_elements=100" "pageSize=100" "size=100" "_limit=100" "limit=100" "elements=100"; do
            printf "%s → " "$q"; curl -sS -m 90 "$B?_page=1&$q" | jq -c '{total:.totalItems, pages:.totalPages, n:(.items|length)}'; done
          for q in "contractType=2" "contractTypeId=2" "minorContract=true" "cpv=92312000-1" "CPV=92312000-1" "awardDate=2025-07-01" "_fullText=concierto" "fullText=concierto" "object=concierto" "contractingAuthority=597" "contractingAuthorityId=597" "authority=597"; do
            printf "%s → " "$q"; curl -sS -m 90 "$B?_page=1&$q" | jq -c '{total:.totalItems, o:[.items[0:2][]?.object[0:40]]}'; done
          curl -sS -m 90 "https://api.euskadi.eus/procurements/contracting-authorities/597/contracts?_page=1" | jq -c '{total:.totalItems, o:[.items[0:2][]?.object[0:40]]}' 
          curl -sS -m 90 "https://api.euskadi.eus/procurements/contracting-authorities?_page=1" | jq -c '{total:.totalItems, n:(.items|length), x:.items[0]}' | head -c 600; echo
          time curl -sS -m 90 -o /dev/null "$B?_page=5000&_elements=1000"
