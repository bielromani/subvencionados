# Descarga de la BDNS las convocatorias de música y sus concesiones y las guarda en datos/bdns/.
# - Cada dos días: busca las nuevas y refresca las de los últimos 60 días (unos 6 minutos).
# - A mano (Actions > Recolectar BDNS > Run workflow): histórico desde la fecha que se indique.
# Los minutos de Actions del repositorio privado son limitados (2.000 al mes en la cuenta): cada ejecución
# tiene un tope de 20 minutos de descarga y ya no se relanza sola; lo pendiente se recoge en la siguiente.
name: Recolectar BDNS

on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha de publicación inicial (aaaa-mm-dd). Vacío = desde la última ejecución'
        required: false
      minutos:
        description: 'Tiempo máximo de descarga (cada minuto cuenta para el límite mensual de Actions)'
        default: '20'
      refrescar_dias:
        description: 'Volver a descargar las publicadas en los últimos N días'
        default: '60'

permissions:
  contents: write

concurrency:
  group: recolectar-bdns
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Recolectar
        id: recolectar
        env:
          DESDE: ${{ inputs.desde }}
          MINUTOS: ${{ inputs.minutos || '20' }}
          REFRESCAR: ${{ inputs.refrescar_dias || '60' }}
        run: |
          args=(--minutos="$MINUTOS" --refrescar-dias="$REFRESCAR")
          if [ -n "$DESDE" ]; then args+=(--desde="$DESDE"); fi
          npm run recolectar -- "${args[@]}"

      - name: Informe del nicho
        if: always()
        run: npm run informe -w server

      - name: Guardar los datos en el repositorio
        if: always()
        run: |
          git config user.name "recolector-bdns"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos docs/informe-nicho.md
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Datos BDNS $(date -u +%Y-%m-%d): ${{ steps.recolectar.outputs.progreso || 0 }} descargas, ${{ steps.recolectar.outputs.pendientes || 0 }} pendientes"
          # Si alguien ha subido cambios mientras tanto, se integran. En caso de conflicto (normalmente
          # docs/informe-nicho.md) gana lo de esta ejecución: los datos solo los escribe este workflow.
          rama="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:$rama" && exit 0
            git fetch origin "$rama"
            git rebase -X theirs "origin/$rama" || { git rebase --abort; sleep $((i * 5)); }
          done
          exit 1
