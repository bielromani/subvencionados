# Festivales de los directorios de las asociaciones del sector (FestClásica, Redescena, REMA) → datos/festivales/.
# Una vez al mes (cambian poco) y a mano. Unos minutos: una petición por segundo a cada web.
name: Recolectar festivales

on:
  schedule:
    - cron: '23 5 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar-festivales
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run festivales -w server
      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "recolector-festivales"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/festivales
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Festivales $(date -u +%Y-%m-%d): directorios del sector"
          rama="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:$rama" && exit 0
            git fetch origin "$rama"
            git rebase -X theirs "origin/$rama" || { git rebase --abort; sleep $((i * 5)); }
          done
          exit 1
