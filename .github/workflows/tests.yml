# Tests, comprobación de tipos y compilación de la web. Solo a mano: para ahorrar minutos de Actions, las
# pruebas se pasan en local antes de cada push (npm test && npm run typecheck) y Vercel compila la web.
name: Tests

on:
  workflow_dispatch:

# Si llegan varios pushes seguidos, solo cuenta el último (ahorra minutos de Actions).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
