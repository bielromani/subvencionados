# Tests, comprobación de tipos y compilación de la web en cada cambio de código.
name: Tests

on:
  push:
    paths-ignore:
      - 'datos/**'
      - '**.md'
      - '.github/workflows/recolectar-*.yml'
      - '.github/workflows/explorar-*.yml'
  workflow_dispatch:

# Si llegan varios pushes seguidos, solo cuenta el último (ahorra minutos de Actions).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
