# Genera con Claude las fichas de las convocatorias (datos/fichas/) a partir del texto de las bases.
# Solo a mano (Actions > Fichas > Run workflow) mientras se mide el coste y la calidad.
# Necesita el secreto ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
name: Fichas

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máximo de fichas en esta ejecución'
        default: '5'
      codigo:
        description: 'Códigos BDNS concretos, separados por comas (vacío = las pendientes por prioridad)'
        required: false
      esfuerzo:
        description: 'Esfuerzo del modelo (low, medium, high)'
        default: 'medium'
      presupuesto_usd:
        description: 'Se para al gastar esta cantidad (dólares)'
        default: '5'

permissions:
  contents: write

concurrency:
  group: fichas
  cancel-in-progress: false

jobs:
  fichas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar fichas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE: ${{ inputs.limite }}
          CODIGO: ${{ inputs.codigo }}
          ESFUERZO: ${{ inputs.esfuerzo }}
          PRESUPUESTO: ${{ inputs.presupuesto_usd }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          args=(--limite="$LIMITE" --esfuerzo="$ESFUERZO" --presupuesto-usd="$PRESUPUESTO")
          if [ -n "$CODIGO" ]; then args+=(--codigo="$CODIGO"); fi
          npm run fichas -w server -- "${args[@]}"

      - name: Guardar las fichas en el repositorio
        if: always()
        run: |
          git config user.name "fichas-bdns"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/fichas
          if git diff --cached --quiet; then
            echo "Sin fichas nuevas."
            exit 0
          fi
          git commit -m "Fichas $(date -u +%Y-%m-%d): $(git diff --cached --name-only | wc -l) actualizadas"
          rama="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:$rama" && exit 0
            git fetch origin "$rama"
            git rebase -X theirs "origin/$rama" || { git rebase --abort; sleep $((i * 5)); }
          done
          exit 1
