# Diagnóstico: consulta la API de la BDNS y muestra las respuestas en bruto,
# para comprobar dominios, endpoints y nombres de campos.
name: Explorar API BDNS

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/explorar-bdns.yml

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Consultar endpoints
        run: |
          pedir() {
            echo "::group::$1"
            curl -sS -m 40 -A "subvencionados/0.1" -H "Accept: application/json" -w "\nHTTP %{http_code} · %{content_type}\n" "$1" | head -c 6000
            echo
            echo "::endgroup::"
          }
          B=https://www.pap.hacienda.gob.es/bdnstrans/api/convocatorias/busqueda?vpd=GE
          resumen() {
            echo "::group::$1"
            curl -sS -m 60 -H "Accept: application/json" "$1" | jq -c '{total: .totalElements, size: .size, n: .numberOfElements, primeros: [.content[:3][] | {numeroConvocatoria, fechaRecepcion, descripcion: .descripcion[:90], nivel1, nivel2}]}' || true
            echo "::endgroup::"
          }
          resumen "$B&page=0&pageSize=5&finalidad=11"
          resumen "$B&page=0&pageSize=5&finalidades=11"
          resumen "$B&page=0&pageSize=5&finalidad=11&fechaDesde=01/01/2025&fechaHasta=31/12/2025"
          resumen "$B&page=0&pageSize=5&order=fechaRecepcion&direccion=asc"
          resumen "$B&page=0&pageSize=1000&finalidad=11"
          resumen "$B&page=0&pageSize=10000&finalidad=11"
          resumen "$B&page=0&pageSize=5&descripcion=musica"
          resumen "$B&page=0&pageSize=5&descripcion=música"
          resumen "$B&page=0&pageSize=5&descripcion=concierto"
          resumen "$B&page=0&pageSize=5&descripcion=opera"
          resumen "$B&page=0&pageSize=5&descripcion=lírica"
          resumen "$B&page=0&pageSize=5&descripcion=orquesta"
          resumen "$B&page=0&pageSize=5&tipoAdministracion=L&finalidad=11"
          resumen "$B&page=0&pageSize=5&tipoAdministracion=A&finalidad=11"
          resumen "$B&page=0&pageSize=5&tipoAdministracion=C&finalidad=11"
          for y in 2008 2012 2014 2015 2016 2017 2018 2020 2022 2024; do
            resumen "$B&page=0&pageSize=1&finalidad=11&fechaDesde=01/01/$y&fechaHasta=31/12/$y"
          done
          C=https://www.pap.hacienda.gob.es/bdnstrans/api
          echo "::group::concesiones de la convocatoria 932065 (Festival Jazz Figueres)"
          curl -sS -m 60 "$C/concesiones/busqueda?vpd=GE&page=0&pageSize=5&numeroConvocatoria=932065" | jq -c '{total: .totalElements, content: [.content[] | del(.idPersona)]}'
          echo "::endgroup::"
          echo "::group::concesiones sin filtro con numeroConvocatoria inexistente"
          curl -sS -m 60 "$C/concesiones/busqueda?vpd=GE&page=0&pageSize=1&numeroConvocatoria=1" | jq -c '{total: .totalElements}'
          echo "::endgroup::"
          echo "::group::detalle con documentos (INAEM música)"
          NUM=$(curl -sS -m 60 "$B&page=0&pageSize=1&descripcion=ayudas%20a%20la%20m%C3%BAsica%20y%20a%20la%20l%C3%ADrica" | jq -r '.content[0].numeroConvocatoria')
          echo "num=$NUM"
          curl -sS -m 60 "$C/convocatorias?vpd=GE&numConv=$NUM" | jq -c '.'
          echo "::endgroup::"
          echo "::group::cabeceras de límite de uso"
          curl -sS -m 60 -D - -o /dev/null "$B&page=0&pageSize=1"
          echo "::endgroup::"
