# Diagnóstico: muestra la estructura de fuentes candidatas para el directorio de cultura
# (directorio de técnicos de cultura de la Diputación de Cádiz, Red de Teatros de la Comunidad de Madrid).
name: Explorar fuentes del directorio

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/explorar-directorio.yml']

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Diputación de Cádiz
        continue-on-error: true
        run: |
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -m 60 -A "$A" -o /tmp/idx.html -w "HTTP %{http_code} %{size_download}\n" https://www.dipucadiz.es/cultura/directorios/provincia/
          echo "::group::enlaces del índice"
          grep -o 'href="[^"]*directorios/provincia/[^"]*"' /tmp/idx.html | sort -u | head -80
          grep -o 'href="[^"]*directorios/provincia/[^"]*"' /tmp/idx.html | sort -u | wc -l
          echo "::endgroup::"
          echo "::group::html del índice (recorte)"
          sed -n '/directorios\/provincia\//,+3p' /tmp/idx.html | head -60
          echo "::endgroup::"
          for u in Cadiz-00003 El-Puerto-de-Santa-Maria-00001 Chiclana-de-la-Frontera-00008 Sanlucar-de-Barrameda-00007; do
            echo "::group::$u"
            curl -sSL -m 60 -A "$A" -o /tmp/m.html -w "HTTP %{http_code} %{size_download}\n" "https://www.dipucadiz.es/cultura/directorios/provincia/$u"
            python3 - <<'EOF'
          import re, html
          t = open('/tmp/m.html', encoding='utf-8', errors='replace').read()
          i = t.find('Organizaci')
          print(t[max(0, i - 3000): i + 6000])
          EOF
            echo "::endgroup::"
          done

      - name: Red de Teatros de la Comunidad de Madrid
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sSL -m 120 -A "Mozilla/5.0" -o /tmp/red.pdf -w "HTTP %{http_code} %{size_download}\n" https://www.madrid.org/clas_artes/red/pdf/directorio-red.pdf
          pdfinfo /tmp/red.pdf | head -20
          pdftotext -layout /tmp/red.pdf - | head -150
          echo "líneas: $(pdftotext -layout /tmp/red.pdf - | wc -l)"
