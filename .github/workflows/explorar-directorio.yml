# Diagnóstico: muestra la estructura de fuentes candidatas para el directorio de cultura
# (directorio de técnicos de cultura de la Diputación de Cádiz, Red de Teatros de la Comunidad de Madrid).
name: Explorar fuentes del directorio

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/explorar-directorio.yml']

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Diputación de Cádiz (listado completo)
        continue-on-error: true
        run: |
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          B="https://www.dipucadiz.es/system/modules/es.dipucadiz.listas/elements/list-inner.jsp?tipo_=Organigrama_F:cc13c603-d83e-11e8-a419-286ed488c708&ruta_=/sites/default/cultura/directorios/provincia/.elements/&incluirFiltros_=false&categoria_=/system/categories/servicios/cultura/&num_columns_=3&listConfig=/cultura/.content/Lista_L/Lista_L_00140.html&usepagination=true&ratio=r-box-21_9&mostrarFecha=false&buscarTitulo=false&hideOptions=true"
          for q in "num_elements_=300" "num_elements_=55&page=2" "num_elements_=55&pagina=2" "num_elements_=55&page_=2" "num_elements_=55&currentPage=2"; do
            curl -sSL -m 60 -A "$A" -o /tmp/l.html "$B&$q"
            echo "$q -> $(grep -o 'directorios/provincia/[A-Za-z0-9-]*' /tmp/l.html | sort -u | wc -l) enlaces; primero: $(grep -o 'directorios/provincia/[A-Za-z0-9-]*' /tmp/l.html | head -1)"
          done
          curl -sSL -m 60 -A "$A" -o /tmp/l.html "$B&num_elements_=300"
          grep -o 'directorios/provincia/[A-Za-z0-9-]*' /tmp/l.html | sort -u | tr '\n' ' '
          echo
          grep -o 'searchStateParameters[^;]*;' /tmp/l.html | head -5
          curl -sSL -m 60 -A "$A" https://www.dipucadiz.es/cultura/directorios/provincia/ | grep -o 'searchStateParameters *=[^;]*;' | head -5

      - name: Red de Teatros de la Comunidad de Madrid
        continue-on-error: true
        run: |
          pip install -q pypdf
          curl -sSL -m 120 -A "Mozilla/5.0" -o /tmp/red.pdf -w "HTTP %{http_code} %{size_download}\n" https://www.madrid.org/clas_artes/red/pdf/directorio-red.pdf
          python3 - <<'EOF'
          from pypdf import PdfReader
          r = PdfReader('/tmp/red.pdf')
          print('páginas', len(r.pages), r.metadata)
          for i, p in enumerate(r.pages[:3]):
              print('--- página', i + 1, '(layout)')
              print(p.extract_text(extraction_mode='layout')[:6000])
          print('--- página 1 (plano)')
          print(r.pages[0].extract_text()[:3000])
          EOF
